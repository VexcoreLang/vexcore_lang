[workspace]
members = [
  ".",
  "crates/ast",
  "crates/lexer",
  "crates/parser",
  "crates/interpreter",
  "crates/stdlib",
  "crates/repl",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
rustyline = "13"

[package]
name = "vexcore"
version = "0.1.0"
edition = "2021"

[dependencies]
clap.workspace = true
lexer = { path = "crates/lexer" }
parser = { path = "crates/parser" }
interpreter = { path = "crates/interpreter" }
repl = { path = "crates/repl" }
ast = { path = "crates/ast" }
